services:
  spark35-master:
    image: structure-integration-pyspark35
    build:
      context: ${STRUCTURE_ROOT:-../..}
      dockerfile: infra/compose/images/pyspark/Dockerfile
      args:
        PYSPARK_VERSION: ${PYSPARK35_VERSION}
    command: >
      spark-class org.apache.spark.deploy.master.Master --host 0.0.0.0 --port 7077 --webui-port 8080
    ports:
      - "${SPARK35_MASTER_PORT}:7077"
      - "${SPARK35_MASTER_UI_PORT}:8080"
    volumes:
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}/.pytest-workspace-tmp/integration
        target: /workspace/.pytest-workspace-tmp/integration

  spark35-worker:
    image: structure-integration-pyspark35
    build:
      context: ${STRUCTURE_ROOT:-../..}
      dockerfile: infra/compose/images/pyspark/Dockerfile
      args:
        PYSPARK_VERSION: ${PYSPARK35_VERSION}
    command: >
      spark-class org.apache.spark.deploy.worker.Worker spark://spark35-master:7077 --webui-port 8081
    depends_on:
      - spark35-master
    ports:
      - "${SPARK35_WORKER_UI_PORT}:8081"
    volumes:
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}
        target: /workspace
        read_only: true
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}/.pytest-workspace-tmp/integration
        target: /workspace/.pytest-workspace-tmp/integration

  spark40-master:
    image: structure-integration-pyspark40
    build:
      context: ${STRUCTURE_ROOT:-../..}
      dockerfile: infra/compose/images/pyspark/Dockerfile
      args:
        PYSPARK_VERSION: ${PYSPARK40_VERSION}
    command: >
      spark-class org.apache.spark.deploy.master.Master --host 0.0.0.0 --port 7077 --webui-port 8080
    ports:
      - "${SPARK40_MASTER_PORT}:7077"
      - "${SPARK40_MASTER_UI_PORT}:8080"
    volumes:
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}/.pytest-workspace-tmp/integration
        target: /workspace/.pytest-workspace-tmp/integration

  spark40-worker:
    image: structure-integration-pyspark40
    build:
      context: ${STRUCTURE_ROOT:-../..}
      dockerfile: infra/compose/images/pyspark/Dockerfile
      args:
        PYSPARK_VERSION: ${PYSPARK40_VERSION}
    command: >
      spark-class org.apache.spark.deploy.worker.Worker spark://spark40-master:7077 --webui-port 8081
    depends_on:
      - spark40-master
    ports:
      - "${SPARK40_WORKER_UI_PORT}:8081"
    volumes:
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}
        target: /workspace
        read_only: true
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}/.pytest-workspace-tmp/integration
        target: /workspace/.pytest-workspace-tmp/integration

  structure-integration-pyspark35:
    image: structure-integration-pyspark35
    build:
      context: ${STRUCTURE_ROOT:-../..}
      dockerfile: infra/compose/images/pyspark/Dockerfile
      args:
        PYSPARK_VERSION: ${PYSPARK35_VERSION}
    command: run-integration pyspark35
    depends_on:
      - spark35-master
      - spark35-worker
    environment:
      STRUCTURE_EXPECTED_PYSPARK: ${PYSPARK35_VERSION}
      STRUCTURE_EXPECTED_SPARK: ${PYSPARK35_VERSION}
      STRUCTURE_INTEGRATION_BACKEND: pyspark35
      STRUCTURE_SPARK_MASTER: spark://spark35-master:7077
      STRUCTURE_SPARK35_MASTER: spark://spark35-master:7077
      STRUCTURE_SPARK40_MASTER: spark://spark40-master:7077
    volumes:
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}
        target: /workspace
        read_only: true
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}/.pytest-workspace-tmp/integration
        target: /workspace/.pytest-workspace-tmp/integration

  structure-integration-pyspark40:
    image: structure-integration-pyspark40
    build:
      context: ${STRUCTURE_ROOT:-../..}
      dockerfile: infra/compose/images/pyspark/Dockerfile
      args:
        PYSPARK_VERSION: ${PYSPARK40_VERSION}
    command: run-integration pyspark40
    depends_on:
      - spark40-master
      - spark40-worker
    environment:
      STRUCTURE_EXPECTED_PYSPARK: ${PYSPARK40_VERSION}
      STRUCTURE_EXPECTED_SPARK: ${PYSPARK40_VERSION}
      STRUCTURE_INTEGRATION_BACKEND: pyspark40
      STRUCTURE_SPARK_MASTER: spark://spark40-master:7077
      STRUCTURE_SPARK35_MASTER: spark://spark35-master:7077
      STRUCTURE_SPARK40_MASTER: spark://spark40-master:7077
    volumes:
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}
        target: /workspace
        read_only: true
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}/.pytest-workspace-tmp/integration
        target: /workspace/.pytest-workspace-tmp/integration

  structure-integration-spark-connect35:
    image: structure-integration-pyspark35
    build:
      context: ${STRUCTURE_ROOT:-../..}
      dockerfile: infra/compose/images/pyspark/Dockerfile
      args:
        PYSPARK_VERSION: ${PYSPARK35_VERSION}
    command: run-integration spark-connect35
    depends_on:
      - spark35-master
      - spark35-worker
    environment:
      STRUCTURE_EXPECTED_PYSPARK: ${PYSPARK35_VERSION}
      STRUCTURE_EXPECTED_SPARK: ${PYSPARK35_VERSION}
      STRUCTURE_INTEGRATION_BACKEND: spark-connect35
      STRUCTURE_SPARK_MASTER: spark://spark35-master:7077
      STRUCTURE_SPARK_CONNECT_MASTER: local[2]
      STRUCTURE_SPARK_REMOTE: sc://127.0.0.1:15002
      STRUCTURE_SPARK_CONNECT_PORT: 15002
      STRUCTURE_SPARK35_MASTER: spark://spark35-master:7077
      STRUCTURE_SPARK40_MASTER: spark://spark40-master:7077
      SPARK_CONNECT_SCALA_VERSION: "2.12"
    volumes:
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}
        target: /workspace
        read_only: true
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}/.pytest-workspace-tmp/integration
        target: /workspace/.pytest-workspace-tmp/integration
      - type: volume
        source: spark-connect-ivy35
        target: /root/.ivy2

  structure-integration-spark-connect40:
    image: structure-integration-pyspark40
    build:
      context: ${STRUCTURE_ROOT:-../..}
      dockerfile: infra/compose/images/pyspark/Dockerfile
      args:
        PYSPARK_VERSION: ${PYSPARK40_VERSION}
    command: run-integration spark-connect40
    depends_on:
      - spark40-master
      - spark40-worker
    environment:
      STRUCTURE_EXPECTED_PYSPARK: ${PYSPARK40_VERSION}
      STRUCTURE_EXPECTED_SPARK: ${PYSPARK40_VERSION}
      STRUCTURE_INTEGRATION_BACKEND: spark-connect40
      STRUCTURE_SPARK_MASTER: spark://spark40-master:7077
      STRUCTURE_SPARK_CONNECT_MASTER: local[2]
      STRUCTURE_SPARK_REMOTE: sc://127.0.0.1:15002
      STRUCTURE_SPARK_CONNECT_PORT: 15002
      STRUCTURE_SPARK35_MASTER: spark://spark35-master:7077
      STRUCTURE_SPARK40_MASTER: spark://spark40-master:7077
      SPARK_CONNECT_SCALA_VERSION: "2.13"
    volumes:
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}
        target: /workspace
        read_only: true
      - type: bind
        source: ${STRUCTURE_ROOT:-../..}/.pytest-workspace-tmp/integration
        target: /workspace/.pytest-workspace-tmp/integration
      - type: volume
        source: spark-connect-ivy40
        target: /root/.ivy2

volumes:
  spark-connect-ivy35:
  spark-connect-ivy40:
