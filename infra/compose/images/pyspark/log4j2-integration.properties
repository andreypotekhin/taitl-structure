status = error
name = SparkIntegration

appender.console.type = Console
appender.console.name = STDERR
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5p %c{1}: %m%n%throwable

rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = STDERR

# These are environment notices, not test or application diagnostics. PySpark's
# own compatibility warnings remain visible through pytest unless explicitly
# filtered in the integration runner.
logger.nativeCodeLoader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativeCodeLoader.level = error
logger.sparkStringUtils.name = org.apache.spark.sql.catalyst.util.SparkStringUtils
logger.sparkStringUtils.level = error
